name: "ownerwatch admin-surface check"
description: "Fail CI when the admin surface of your EVM contracts drifts: owners, proxy admins, implementations, roles, Safe signers and thresholds, timelock delays."
author: "imal1ice"
branding:
  icon: "shield"
  color: "blue"
inputs:
  config:
    description: "Path to the ownerwatch config listing the contracts and Safes to probe."
    required: false
    default: "ownerwatch.yaml"
  baseline:
    description: "Path to the committed admin-surface report to compare against. Commit the generated report here on the first run."
    required: false
    default: "admin-surface.md"
  label:
    description: "Protocol name used in the report heading."
    required: false
    default: "${{ github.repository }}"
  rpc:
    description: "RPC URL that allows eth_call, overriding the config for single-chain configs. Multi-chain configs set probe_rpc_url per chain instead."
    required: false
    default: ""
  roles-from-logs:
    description: "Replay RoleGranted/RoleRevoked logs to list every current role holder (slower; needs log history)."
    required: false
    default: "false"
  fail-on-drift:
    description: "Fail the step when the report differs from the baseline (or when no baseline exists yet)."
    required: false
    default: "true"
  disclosure:
    description: "Path to a committed ERC-8241 control disclosure (JSON). When set, it is checked against chain state and the step fails on any mismatch or undisclosed power. Needs ownerwatch >= 0.9.0 and the rpc input."
    required: false
    default: ""
  disclosure-roles-from-logs:
    description: "With disclosure: replay role grants from logs so every role holder counts towards completeness."
    required: false
    default: "true"
  logs-rpc:
    description: "With disclosure: RPC for eth_getLogs in the role replay (default: a public full-history gateway, else rpc)."
    required: false
    default: ""
  version:
    description: "ownerwatch version to install from PyPI, e.g. 0.7.3. Empty installs the latest."
    required: false
    default: ""
outputs:
  drifted:
    description: "true when the admin surface differs from the baseline or no baseline exists."
    value: ${{ steps.compare.outputs.drifted }}
  report:
    description: "Path of the freshly generated report."
    value: ${{ steps.probe.outputs.report }}
  disclosure-ok:
    description: "true when the ERC-8241 disclosure matches chain state with nothing undisclosed; empty when no disclosure is set."
    value: ${{ steps.disclosure.outputs.ok }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ownerwatch
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then pip install -q "ownerwatch==${{ inputs.version }}"; else pip install -q ownerwatch; fi
        ownerwatch --version
    - name: Probe the admin surface
      id: probe
      # a disclosure-only setup has no config to probe
      if: inputs.disclosure == '' || hashFiles(inputs.config) != ''
      shell: bash
      run: |
        set -euo pipefail
        base="${{ inputs.baseline }}"
        report="${base%.md}.new.md"
        args=(probe --config "${{ inputs.config }}" --markdown --label "${{ inputs.label }}")
        if [ -n "${{ inputs.rpc }}" ]; then args+=(--rpc "${{ inputs.rpc }}"); fi
        if [ "${{ inputs.roles-from-logs }}" = "true" ]; then args+=(--roles-from-logs); fi
        ownerwatch "${args[@]}" > "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
    - name: Compare with the committed baseline
      id: compare
      if: inputs.disclosure == '' || hashFiles(inputs.config) != ''
      shell: bash
      run: |
        set -uo pipefail
        base="${{ inputs.baseline }}"
        report="${{ steps.probe.outputs.report }}"
        # Compare the facts (the table: who controls what, type, delay), not the Findings prose,
        # so a wording change in a new ownerwatch release does not read as drift.
        strip() { grep -v '^_Generated' "$1" | sed '/^## Findings/,$d'; }
        if [ ! -f "$base" ]; then
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Admin surface: no baseline yet"
            echo
            echo "Commit \`$report\` as \`$base\` to seed the baseline. Current report:"
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::No baseline at $base. Commit $report as $base to seed it."
          cat "$report"
          if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit 1; fi
          exit 0
        fi
        if diff_out=$(diff <(strip "$base") <(strip "$report")); then
          echo "drifted=false" >> "$GITHUB_OUTPUT"
          echo "## Admin surface unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin surface unchanged."
        else
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Admin surface changed"
            echo
            echo '```diff'
            echo "$diff_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$diff_out"
          echo "::error::Admin surface changed since the committed report at $base. Review the diff, then commit $report as $base if the change is expected."
          if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit 1; fi
        fi
    - name: Check the ERC-8241 disclosure
      id: disclosure
      # runs even when the drift check above failed, so one run reports both
      if: ${{ !cancelled() && inputs.disclosure != '' }}
      shell: bash
      run: |
        set -uo pipefail
        if [ -z "${{ inputs.rpc }}" ]; then echo "::error::The disclosure input needs the rpc input."; exit 1; fi
        args=(disclosure check "${{ inputs.disclosure }}" --rpc "${{ inputs.rpc }}")
        if [ "${{ inputs.disclosure-roles-from-logs }}" != "true" ]; then args+=(--no-roles-from-logs); fi
        if [ -n "${{ inputs.logs-rpc }}" ]; then args+=(--logs-rpc "${{ inputs.logs-rpc }}"); fi
        out=$(ownerwatch "${args[@]}"); rc=$?
        echo "$out"
        {
          if [ $rc -eq 0 ]; then echo "## ERC-8241 disclosure matches chain state"; else echo "## ERC-8241 disclosure does not match chain state"; fi
          echo
          echo '```'
          echo "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ $rc -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        echo "ok=false" >> "$GITHUB_OUTPUT"
        echo "::error::The ERC-8241 disclosure at ${{ inputs.disclosure }} does not match chain state. Fix the disclosure or the contracts, then re-run."
        if [ "${{ inputs.fail-on-drift }}" = "true" ]; then exit 1; fi
